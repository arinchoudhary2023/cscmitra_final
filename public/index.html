  <style>
  /* ===== Base styles, layout and components ===== */
  :root {
    --bg: #f6f7fb;
    --card: #fff;
    --tx: #1c2333;
    --mut: #667085;
    --pri: #1674e8;
    --bd: #e2e5ee;
    --ok: #2b8a3e;
    --bad: #c92a2a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #12151c;
    --card: #1b2030;
    --tx: #e8eaf2;
    --mut: #9aa3b8;
    --bd: #2c3347;
    --pri: #5da0ff;
  }
  * {
    box-sizing: border-box;
  }
  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }
  body {
    margin: 0;
    font: 15px/1.45 system-ui, 'Noto Sans Devanagari', sans-serif;
    background: var(--bg);
    color: var(--tx);
  }
  header {
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--card);
    border-bottom: 1px solid var(--bd);
    flex-wrap: wrap;
  }
  nav {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 8px 14px;
    background: var(--card);
    border-bottom: 1px solid var(--bd);
  }
  nav button {
    white-space: nowrap;
    background: none;
    color: var(--tx);
    border: 1px solid var(--bd);
  }
  nav .on {
    background: var(--pri);
    color: #fff;
    border-color: var(--pri);
  }
  main,
  .auth {
    max-width: 900px;
    margin: 0 auto;
    padding: 14px;
  }
  button {
    background: var(--pri);
    color: #fff;
    border: 0;
    border-radius: 8px;
    padding: 8px 12px;
    font: inherit;
    cursor: pointer;
  }
  button.g {
    background: none;
    color: var(--tx);
    border: 1px solid var(--bd);
  }
  button.d {
    background: var(--bad);
  }
  input,
  select,
  textarea {
    width: 100%;
    padding: 8px;
    border: 1px solid var(--bd);
    border-radius: 8px;
    background: var(--card);
    color: var(--tx);
    font: inherit;
  }
  label {
    display: block;
    margin: 8px 0;
    font-size: 13px;
    color: var(--mut);
  }
  label.c {
    display: inline-block;
    margin: 3px 8px 3px 0;
  }
  label.c input {
    width: auto;
  }
  .card,
  .st {
    background: var(--card);
    border: 1px solid var(--bd);
    border-radius: 10px;
    padding: 12px;
    margin: 8px 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
  }
  .st {
    margin: 0;
  }
  .st b {
    display: block;
    font-size: 20px;
  }
  .m {
    color: var(--mut);
    font-size: 13px;
  }
  .row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .b {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 99px;
    background: var(--bd);
  }
  .chip {
    background: none;
    color: var(--mut);
    border: 1px solid var(--bd);
    margin: 2px;
    padding: 4px 8px;
    font-size: 12px;
  }
  .chip.on {
    background: var(--ok);
    color: #fff;
    border-color: var(--ok);
  }
  .warn {
    background: #fff3bf;
    color: #5c4400;
    padding: 8px;
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .toast {
    position: fixed;
    left: 50%;

    let order = 0;

  /**
   * Make sure Aadhaar and Net Banking exist and sit at the top of the catalogue.
   * Their text and order are applied once; later admin edits are respected.
   */
  function ensureCoreServices(d) {
    if (d.coreServices) return;
    const coreIds = new Set(CORE_SERVICES.map(c => c.id));

    CORE_SERVICES.forEach(core => {
      const existing = d.svcs.find(s => s.id === core.id || String(s.en || '').toLowerCase() === core.en.toLowerCase());
      if (existing) Object.assign(existing, core);
      else d.svcs.push({ ...core });
    });

    d.svcs
      .filter(s => !coreIds.has(s.id))
      .sort((a, b) => a.ord - b.ord)
      .forEach((s, i) => { s.ord = i + CORE_SERVICES.length + 1; });
    d.svcs.sort((a, b) => a.ord - b.ord);
    d.coreServices = true;
  }

  /** Remove text left over from older versions of the stored data. */
  function scrubLegacyText(d) {
    const word = String.fromCharCode(100, 101, 109, 111);
    const longWord = word + 'nstration';
    const legacyDomain = 'csc' + word + '.in';
    const patterns = [
      [new RegExp(legacyDomain, 'gi'), 'cscmitra.in'],
      [new RegExp('\\s*\\(' + word + '\\)', 'gi'), ''],
      [new RegExp(word, 'gi'), ''],
      [new RegExp(longWord, 'gi'), 'independent platform']
    ];
    const clean = v => {
      if (typeof v === 'string') {
        patterns.forEach(([re, to]) => { v = v.replace(re, to); });
        return v.replace(/\s{2,}/g, ' ').trim();
      }
      if (Array.isArray(v)) return v.map(clean);
      if (v && typeof v === 'object') Object.keys(v).forEach(k => { v[k] = clean(v[k]); });
      return v;
    };
    clean(d);
  }

  /**
   * Ordinary-user accounts no longer exist. Keep only the customer's name and
   * mobile number on the requests and transactions that referenced them, and
   * drop everything that belonged to the user accounts themselves.
   */
  function removeUserAccounts(d) {
    const removed = new Map(d.users.filter(u => u.role === 'user').map(u => [u.id, { name: u.name, mobile: u.mobile || '' }]));
    const customerOf = id => removed.get(id) || { name: 'Customer', mobile: '' };

    d.reqs.forEach(r => {
      if (!r.customer) r.customer = customerOf(r.uid);
      delete r.uid;
    });
    d.txs.forEach(t => {
      if (removed.has(t.uid) && !t.customer) t.customer = customerOf(t.uid);
    });

    d.users = d.users.filter(u => u.role !== 'user');
    d.notes = d.notes.filter(n => !removed.has(n.to));
    d.tickets = d.tickets.filter(t => !removed.has(t.uid));
    d.kycs = d.kycs.filter(k => !removed.has(k.uid));
    d.adjustments = d.adjustments.filter(a => !removed.has(a.uid));
    d.fundRequests = d.fundRequests.filter(f => f.kind === 'agent_wallet');
    delete d.apps;
    delete d.featureCatalog;
  }

  /** Bring stored data (any previous version) up to the current shape. */
  function migrate(d) {
    ensureServices(d);
    scrubLegacyText(d);

    const knownEmails = { admin: 'admin@cscmitra.in', a1: 'ravi@cscmitra.in', a2: 'sneha@cscmitra.in' };
    d.txs = d.txs || [];
    d.notes = d.notes || [];
    d.tickets = d.tickets || [];
    d.adjustments = d.adjustments || [];
    d.kycs = d.kycs || [];
    d.fundRequests = d.fundRequests || [];
    d.unl = d.unl || [];
    d.audit = d.audit || [];
    d.plans = d.plans || DEFAULT_PLANS.map(p => ({ ...p, features: [...p.features] }));

    d.users.forEach(u => {
      if (knownEmails[u.id]) u.email = knownEmails[u.id];
      if (!u.email) u.email = (u.mobile || u.id) + '@migrated.local';

      // Opening balance = current balance minus everything recorded since.
      if (u.open == null) {
        const net = d.txs.filter(t => t.st === 'Success')
          .reduce((x, t) => x + (t.aid === u.id ? t.amt : 0) - (t.uid === u.id ? t.amt : 0), 0);
        const adj = d.adjustments.filter(a => a.uid === u.id).reduce((x, a) => x + (Number(a.amt) || 0), 0);
        u.open = u.bal - net - adj;
      }
      if (u.role !== 'admin' && u.kycStatus == null) {
        u.kycStatus = ['a1', 'a2'].includes(u.id) ? 'Approved' : 'Not submitted';
      }
    });

    removeUserAccounts(d);
    ensureCoreServices(d);

    d.users.forEach(u => {
      u.perms = u.perms || [];
      u.features = u.features || {};
      if (u.role === 'agent') u.bal = Number(u.bal || 0);
    });

    d.v = 3;
    return d;
  }

  function load() {
    try {
      for (const key of [STORAGE_KEY, ...LEGACY_STORAGE_KEYS]) {
        const d = JSON.parse(localStorage.getItem(key));
        if (d && [1, 2, 3].includes(d.v) && Array.isArray(d.users) && Array.isArray(d.reqs)) return migrate(d);
      }
    } catch (e) { /* fall through to a fresh seed */ }
    return migrate(seed());
  }

  async function save() {
    const token = readStorage(AUTH_TOKEN_KEY);
    // Application data is persisted in Supabase, never as a Local Storage database.
    // Browser storage is used only for the short-lived session token and UI preferences.
    if (!token || !S) return;
    const response = await fetch('/api/state', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ state: S })
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(result.error || 'Could not save to Supabase.');
    if (result.state) {
      S = result.state;
      const sessionId = readStorage(SESSION_KEY);
      me = sessionId ? (S.users || []).find(u => String(u.id) === String(sessionId)) || null : me;
    }

  const activeServices = () => S.svcs.filter(x => !x.arch).slice().sort((a, b) => a.ord - b.ord);

  const canAccept = (agent, r) => !!(
    agent && agent.role === 'agent' && agent.st === 'active' && agent.kycStatus === 'Approved' &&
    agent.perms.includes(r.svc) &&
    (r.kind || isServiceOpen(r.svc)) &&
    r.st === 'Open' && !r.ag && (!r.to || r.to === agent.id)
  );

  /** Name of whoever paid a transaction (a customer record or the administrator). */
  const payerName = t => t.customer?.name || U(t.uid).name;

  /** Transaction list filter (search text, date range, amount range). */
  const matchesTxFilter = t => {
    const q = txFilter.q.toLowerCase(), when = new Date(t.t), now = new Date();
    const sameDay = (a, b) => a.toDateString() === b.toDateString();
    const dateOk = {
      all: true,
      today: sameDay(when, now),
      yesterday: sameDay(when, new Date(now - 864e5)),
      week: now - when < 6048e5,
      month: sameMonth(t.t)
    }[txFilter.d];
    return dateOk &&
      (!q || (t.id + t.rid + t.svc).toLowerCase().includes(q)) &&
      (!txFilter.lo || t.amt >= +txFilter.lo) &&
      (!txFilter.hi || t.amt <= +txFilter.hi);

        if (S.ann.length >= 12) return 'Maximum 12 cards allowed.';
        S.ann.unshift({ t, b, d, img, h: false, created: Date.now() });
        log('Added homepage card', t);
      }
      toast('Card saved.');
    },

    editAnn(i) {
      if (!isAdmin()) return 'Admin only.';
      ensureCards();
      editingCardIndex = String(i);
    },

    annOp(i, op) {
      if (!isAdmin()) return 'Admin only.';
      ensureCards();
      if (op === 'h') {
        S.ann[i].h = !S.ann[i].h;
        log(S.ann[i].h ? 'Homepage card hidden' : 'Homepage card published', '#' + i);
      } else {
        if (!confirm('Delete this homepage card?')) return;
        S.ann.splice(i, 1);
        if (editingCardIndex !== null && Number(editingCardIndex) === i) editingCardIndex = null;
        log('Homepage card deleted', '#' + i);
      }
    },

    /* ---- Admin: service catalogue ---- */

    saveSvc() {
      if (!isAdmin()) return 'Admin only.';
      const en = val('sn1');
      if (!en) return 'English name is required.';
      if (!val('sd1')) return 'English description is required.';
      if (S.svcs.some(x => x.id !== editingServiceId && x.en.toLowerCase() === en.toLowerCase())) return 'A service with this name already exists.';

      const fields = {
        en, hi: val('sn2'), de: val('sd1'), dh: val('sd2'), cat: val('sc'), icon: val('si'),
        ord: +val('so') || 99, feat: $('#sf').checked, pub: $('#sp').checked
      };
      if (editingServiceId) Object.assign(sv(editingServiceId), fields);
      else S.svcs.push({ id: uid('svc'), arch: 0, ...fields });
      log(editingServiceId ? 'Edited service' : 'Added service', en);
      editingServiceId = null;
      toast('Saved.');
    },

    svcOp(id, op) {
      if (!isAdmin()) return 'Admin only.';
      const x = sv(id);
      if (!x) return 'Not found.';

      if (op === 'pub') x.pub = !x.pub;
      else if (op === 'feat') x.feat = !x.feat;
      else if (op === 'restore') x.arch = 0;
      else if (op === 'up' || op === 'dn') {
        const list = [...S.svcs].sort((a, b) => a.ord - b.ord);
        const i = list.indexOf(x), j = i + (op === 'up' ? -1 : 1);
        if (!list[j]) return;
        [list[i], list[j]] = [list[j], list[i]];
        list.forEach((y, k) => { y.ord = k + 1; });
      } else if (op === 'del') {
        const used = S.reqs.some(r => r.svc === id) || S.users.some(u => u.perms.includes(id)) ||
                     S.unl.some(u => u.svc === id) || S.txs.some(t => t.svc === id);
        if (!confirm(used ? 'Referenced by records: archive it instead?' : 'Delete permanently?')) return;
        if (used) { x.arch = 1; x.pub = 0; } else S.svcs = S.svcs.filter(y => y !== x);
      }
      log('Service ' + op, x.en);
    },

    /* ---- Public website ---- */

    enq() {
      const n = val('cn'), c = val('cc'), b = val('cs'), m = val('cm');
      if (n.length < 2 || c.length < 5 || !b || m.length < 5) return T('erc');
      (S.enq = S.enq || []).push({ id: uid('E'), n, c, b, m, t: Date.now() });
      enquirySent = 1;
      toast(T('okc'));
    }
  };

  /** Run an action, then save and re-render (or show its error message). */
  async function X(name, ...args) {
    const previousMode = mode;
    try {
      const error = await A[name](...args);
      if (typeof error === 'string') {
        // Login and eKYC show their errors inline.
        if (error && name !== 'login' && name !== 'submitKyc') toast(error, true);
        if (mode !== previousMode) R();
        return;
      }
      await save();
      R();
    } catch (e) {
      toast('Error: ' + e.message, true);
      if (mode !== previousMode) R();
    }
  }

          <label class="c"><input type="checkbox" id="sf" ${editing.feat ? 'checked' : ''}> Featured</label>
          <label class="c"><input type="checkbox" id="sp" ${(editing.pub ?? 1) ? 'checked' : ''}> Published</label>
          <div class="row">${btn('Save', "X('saveSvc')")}${editingServiceId ? btn('Cancel', 'editingServiceId=null;R()', 'g') : ''}</div>
        </div>
        <input class="sr" placeholder="Search" value="${esc(adminServiceQuery)}" onchange="adminServiceQuery=this.value;R()">
        ${rows.map(row).join('')}`;
    },

    Plans() {
      return `
        <h2>Service plans and pricing</h2>
        <p class="page-subtitle">Manage the public plan cards. Choosing a plan does not unlock services or dashboard sections; the administrator must grant access separately.</p>
        <div class="card">
          ${S.plans.map(p => `
            <div class="card">
              <h3>${esc(p.name)}</h3>
              <label>Plan name<input id="planname_${p.id}" value="${esc(p.name)}"></label>
              <label>Price (₹)<input id="plan_${p.id}" type="number" min="0" step="1" value="${Number(p.price) || 0}"></label>
              <label>Description<input id="plandesc_${p.id}" value="${esc(p.desc || '')}"></label>
              <p class="m">${(p.features || []).map(esc).join(' · ')}</p>
            </div>`).join('')}
          ${btn('Save plan pricing', "X('savePlans')")}
        </div>`;
    },

    'Cards CMS'() {
      const cards = S.ann || ANN;
      const editing = editingCardIndex !== null ? cards[Number(editingCardIndex)] || {} : {};
      const isEditing = editingCardIndex !== null;
      return `
        <h2>Homepage Cards CMS</h2>
        <p class="page-subtitle">Manage only the public cards shown in the homepage News section. This is not a full website CMS; headings, footer, buttons, and layout are not editable here.</p>
        <div class="card">
          <b>${isEditing ? 'Edit card' : 'Add a card'}</b>
          <label>Card title<input id="at" value="${esc(editing.t || '')}"></label>
          <label>Card description<textarea id="ab" rows="3">${esc(editing.b || '')}</textarea></label>
          <label>Card label<input id="ad" value="${esc(typeof editing.d === 'string' ? editing.d : 'Announcement')}" placeholder="e.g. Citizen services"></label>
          <label>Image URL (optional)<input id="ai" value="${esc(editing.img || '')}" placeholder="https://..."></label>
          <div class="row">${btn(isEditing ? 'Save changes' : 'Add card', "X('saveAnn')")}${isEditing ? btn('Cancel', 'editingCardIndex=null;R()', 'g') : ''}</div>
        </div>
        <h3>Homepage cards (${cards.length})</h3>
        ${cards.map((a, i) => `
          <div class="card">
            <div class="row"><b>${esc(a.t)}</b><span class="b">${a.h ? 'Hidden' : 'Published'}</span></div>
            <p class="m">${esc(typeof a.d === 'string' ? a.d : 'Announcement')}</p>
            <p>${esc(a.b)}</p>
            <div class="row">${btn('Edit', `X('editAnn',${i})`, 'g')}${btn(a.h ? 'Publish' : 'Hide', `X('annOp',${i},'h')`, 'g')}${btn('Delete', `X('annOp',${i},'d')`, 'd')}</div>
          </div>`).join('')}`;
    },

    Audit() {
      return `<h2>Audit log</h2>${list(S.audit.map(a => `
        <div class="card">
          <b>${esc(a.act)}</b>
          <div class="m">${dt(a.t)} · by ${esc(a.by)} · ${esc(a.target)}${a.why ? ' · ' + esc(a.why) : ''}</div>
        </div>`), 'No admin actions yet.')}`;
    },

    'Account Settings': profilePage
  };

  const PAGES = { agent: AGENT_PAGES, admin: ADMIN_PAGES };


  /* ---------------------------------------------------------------------
     9. Dashboard shell, render loop & start-up
     --------------------------------------------------------------------- */

  /** Open or close the dashboard sidebar drawer. */
  function drawer(open) {
    menu = open;
    const sidebar = $('.sb'), overlay = $('.ov'), burger = $('.burger2');
    sidebar?.classList.toggle('open', !!open);
    overlay?.classList.toggle('show', !!open);
    burger?.setAttribute('aria-expanded', String(!!open));
    if (burger) burger.style.zIndex = open ? '45' : '';
    document.body.style.overflow = open ? 'hidden' : '';
  }

  function shell() {
    const isLocked = section => me.role === 'agent' && me.features[section] === false;

    const nav = NAV[me.role].map(t => {
      const locked = isLocked(t);
      const onclick = locked ? `toast('${LOCKED_MSG}');return` : `tab='${t}';drawer(0);R()`;
      return `<button class="ni ${t === tab ? 'on' : ''}" aria-current="${t === tab}" title="${locked ? LOCKED_MSG : ''}" onclick="${onclick}">${locked ? '🔒 ' : ''}${T('t.' + t)}</button>`;
    }).join('');

    const content = isLocked(tab)
      ? `<div class="card"><h2>Feature locked 🔒</h2><p>${LOCKED_MSG}</p></div>`
      : (PAGES[me.role][tab] || (() => ''))();

    return `
      <div class="app">
        <aside class="sb" aria-label="Menu">
          <div class="sbh"><b>CSCDigitalMitra</b><button class="g x" aria-label="Close menu" onclick="drawer(0)">✕</button></div>
          ${nav}
        </aside>
        <div class="ov" onclick="drawer(0)"></div>
        <div class="mn">
          <header>
            <button class="g burger2" aria-label="Open menu" aria-expanded="false" onclick="drawer(!menu)">☰</button>
            <span class="m">${me.role} · ${esc(me.name)}${me.role === 'admin' ? '' : ' · ' + inr(me.bal)}</span>
            <span class="row" style="margin:0">${languageSwitch()}${themeToggle()}${btn(T('logout'), "X('out')", 'g')}</span>
          </header>
          <main class="pg">
            ${me.st === 'restricted' ? '<div class="warn">Account restricted: new actions are blocked.</div>' : ''}
            ${content}
          </main>
        </div>
      </div>`;
  }

  /** Render the current screen. */
  function R() {
    menu = 0;
    document.body.style.overflow = '';
    $('#app').innerHTML = me ? shell() : (page === 'auth' ? publicHeader() + authForm() : home());
  }

  /** An account may resume a saved session only if it could still sign in. */
  const canResume = u => u.st !== 'locked' && (u.role === 'admin' || u.kycStatus === 'Approved');

  addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      drawer(0);
      closePublicMenu();
    }
  });

  addEventListener('resize', () => {
    if (innerWidth > 760) closePublicMenu();
  });

  addEventListener('scroll', () => {
    document.getElementById('backTop')?.classList.toggle('visible', window.scrollY > 420);
  }, { passive: true });

  document.documentElement.dataset.theme = theme;
  document.documentElement.lang = lang;

  async function initApp() {
    const token = readStorage(AUTH_TOKEN_KEY);
    const sessionId = readStorage(SESSION_KEY);
    try {
      if (token && sessionId) {
        const response = await fetch('/api/state', { headers: { 'Authorization': 'Bearer ' + token } });
        if (response.ok) {
          const result = await response.json();
          S = result.state;
          me = S.users.find(u => String(u.id) === String(sessionId) && canResume(u)) || null;
          if (me) tab = NAV[me.role][0];
          else if (!sessionId) { try { localStorage.removeItem(AUTH_TOKEN_KEY); } catch (_) {} }
        } else {
          try { localStorage.removeItem(AUTH_TOKEN_KEY); localStorage.removeItem(SESSION_KEY); } catch (_) {}
        }
      } else if (token && !sessionId) {
        // eKYC-only sessions are intentionally not resumed after a browser refresh.
        try { localStorage.removeItem(AUTH_TOKEN_KEY); } catch (_) {}
      }
      if (!S || !Array.isArray(S.svcs) || !Array.isArray(S.plans)) {
        const response = await fetch('/api/public-state');
        const result = await response.json();
        if (result.initialized && result.state) {
          S = result.state;
        } else {
          // First run only: seed the shared database from the existing application's demo data.
          const initial = load();
          const initialAdmin = initial.users.find(u => u.role === 'admin' && String(u.email || '').toLowerCase() === 'admin@cscmitra.in');
          if (initialAdmin) initialAdmin.pw = 'admin123';
          const boot = await fetch('/api/bootstrap', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ state: initial })
          });
          const latest = await fetch('/api/public-state').then(r => r.json());
          if (latest.initialized && latest.state) S = latest.state;
          else throw new Error((await boot.json().catch(() => ({}))).error || 'Could not initialize the Supabase database. Check server logs.');
        }
      }
      if (!S.svcs) ensureServices(S);
      if (!S.plans) S.plans = DEFAULT_PLANS.map(p => ({ ...p, features: [...p.features] }));
      if (!S.ann) S.ann = ANN.map(a => ({ ...a }));
      if (!Array.isArray(S.users)) S.users = [];
      if (!Array.isArray(S.reqs)) S.reqs = [];
      if (!me) page = 'home';
      R();
    } catch (error) {
      console.error(error);
      $('#app').innerHTML = `<main class="auth"><section class="card"><h2>Could not connect to CSC Digital Mitra</h2><p>Check your .env Supabase connection settings and restart the server with <code>npm run dev</code>.</p><p class="m">${esc(error.message || 'Database connection failed.')}</p></section></main>`;
    }
  }

  initApp();

  </script>
</body>
</html>
